<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Bé ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= CUỐN SÁCH ================= -->

  <div id="book">

    <!-- ================= TRANG 1 - BÁNH KEM ================= -->

    <section class="page page-front">

      <div class="birthday-page">

        <!-- BÁNH KEM -->
        <div class="cake">

          <!-- NẾN -->
          <div class="candle">
            <div class="flame"></div>
          </div>

          <!-- TẦNG TRÊN -->
          <div class="cake-layer cake-top">

            <div class="cream">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

          </div>


          <!-- TẦNG DƯỚI -->
          <div class="cake-layer cake-bottom">

            <div class="cake-decoration">
              <i>♥</i>
              <i>♥</i>
              <i>♥</i>
            </div>

          </div>


          <!-- ĐĨA -->
          <div class="plate"></div>

        </div>


        <!-- CHỮ -->
        <h1>happy birthday!</h1>

        <div class="name">
          Bé iu <span>❤️</span>
        </div>


        <!-- NÚT MỞ TRANG -->
        <button id="openBtn">
          Mở trang 💌
        </button>

      </div>

    </section>


    <!-- ================= TRANG 2 - CÂY TIM ================= -->

    <section class="page page-back">

      <div class="tree-page">

        <div class="tree-area">

          <!-- CÂY TIM -->
          <div id="heartTree"></div>

          <!-- THÂN CÂY -->
          <div class="tree-trunk"></div>

          <!-- MẶT ĐẤT -->
          <div class="ground"></div>
         
          <button id="backBtn" type="button">← Quay lại 💌</button>

        </div>


        <!-- LỜI CHÚC -->

        <div class="message">

          <h2>Happy Birthday! 🎂</h2>

          <p class="wish">
            Chúc Bé iu có một sinh nhật thật vui vẻ ❤️
          </p>

          <p class="wish">
            Mong mọi điều tốt đẹp nhất sẽ đến với Bé.
          </p>

          <p class="wish">
            Luôn vui vẻ, hạnh phúc và luôn mỉm cười nhé 💕
          </p>

          <p class="wish">
            Anh yêu Bé rất nhiều ❤️
          </p>

        </div>

      </div>

    </section>

  </div>


  <!-- TIM BAY -->

  <div id="floatingHearts"></div>


  <script src="script.js"></script>

</body>
</html>
