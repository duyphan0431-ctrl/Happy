<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Bé ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="book">

    <!-- ================= TRANG 1 ================= -->
    <div class="page page-front">
      <div class="cover">

        <!-- BÁNH KEM -->
        <div class="cake">

          <div class="candle">
            <div class="flame"></div>
          </div>

          <div class="cream cream-top"></div>

          <div class="cake-top">
            <div class="cream-drop"></div>
            <div class="cream-drop"></div>
            <div class="cream-drop"></div>
            <div class="cream-drop"></div>
            <div class="cream-drop"></div>
          </div>

          <div class="cake-middle">
            <span>♥</span>
            <span>♥</span>
            <span>♥</span>
          </div>

          <div class="cake-bottom"></div>

          <div class="plate"></div>
        </div>

        <h1>Happy Birthday</h1>
        <p>Gửi đến Bé iu ❤️</p>

        <button id="openBtn">Mở trang 💌</button>

      </div>
    </div>


    <!-- ================= TRANG 2 ================= -->
    <div class="page page-back">
      <div class="content">

        <div class="tree-area">
          <div id="heartTree"></div>

          <div class="tree-trunk"></div>

          <div class="ground"></div>
        </div>

        <div class="message">
          <h2>Happy Birthday! 🎂</h2>

          <p class="wish">
            Chúc Bé iu có một sinh nhật thật vui vẻ ❤️
          </p>

          <p class="wish">
            Mong mọi điều tốt đẹp nhất sẽ đến với Bé.
          </p>

          <p class="wish">
            Luôn vui vẻ, hạnh phúc và luôn mỉm cười nhé 💕
          </p>

          <p class="wish">
            Anh yêu Bé rất nhiều ❤️
          </p>
        </div>

      </div>
    </div>

  </div>

  <div id="floatingHearts"></div>

  <script src="script.js"></script>

</body>
</html>
